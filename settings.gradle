pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'BlockOffensive'

includeBuild('FPSMatch') {
    dependencySubstitution {
        substitute module('com.ptcrys:fpsmatch') using project(':')
    }
}

